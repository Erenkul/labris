<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyurular</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 24px;
            color: #222;
        }

        .duyuru {
            background-color: #fff;
            padding: 20px;
            margin-bottom: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .duyuru h2 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #1f4e79;
        }

        .duyuru .icerik {
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .tarih {
            color: #777;
            font-size: 14px;
        }

        .bos-mesaj {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Duyurular</h1>

        {% for duyuru in duyurular %}
            <div class="duyuru">
                <h2>{{ duyuru.baslik }}</h2>

                <div class="icerik">
                    {{ duyuru.icerik }}
                </div>

                <div class="tarih">
                    Oluşturulma tarihi: {{ duyuru.olusturulma_tarihi }}
                </div>
            </div>
        {% empty %}
            <div class="bos-mesaj">
                Henüz duyuru yok.
            </div>
        {% endfor %}
    </div>
</body>
</html>
