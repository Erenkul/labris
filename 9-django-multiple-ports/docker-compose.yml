services:
  db:
    image: mysql:8.0
    container_name: django-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: djangodb
      MYSQL_USER: djangouser
      MYSQL_PASSWORD: djangopass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  admin-panel:
    build: .
    container_name: django-admin-panel
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_URLCONF=config.urls_admin
    depends_on:
      - db
    volumes:
      - .:/app

  user-panel:
    build: .
    container_name: django-user-panel
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_URLCONF=config.urls_user
    depends_on:
      - db
    volumes:
      - .:/app

  nginx:
    image:  nginx:latest
    container_name: django-nginx
    ports:
      - "80:80"
      - "85:85"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - admin-panel
      - user-panel

volumes:
  mysql_data: